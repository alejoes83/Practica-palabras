<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Practica palabras</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#dff1fb;--card:#fff;--ink:#17324d;--sun:#ffc93c;--rec:#ef6f5e;--ok:#3fae6a;--mut:#5d7790;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10243a;--card:#1b3652;--ink:#f2f7fb;--mut:#a9c0d6}}
:root[data-theme="dark"]{--bg:#10243a;--card:#1b3652;--ink:#f2f7fb;--mut:#a9c0d6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka','Trebuchet MS',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.tabs{display:flex;gap:8px;padding:14px;width:100%;max-width:520px}
.tabs button{flex:1;font:inherit;font-size:1.05rem;padding:12px;border:0;border-radius:16px;background:var(--card);color:var(--ink);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--sun);color:#17324d;font-weight:600}
main{width:100%;max-width:520px;padding:0 14px 28px}
.card{background:var(--card);border-radius:28px;padding:22px 18px;text-align:center}
.emoji{font-size:clamp(5rem,28vw,8rem);line-height:1.1}
.word{font-size:clamp(2.6rem,14vw,4.2rem);font-weight:600;margin:4px 0 14px}
.row{display:flex;flex-direction:column;gap:12px}
.big{font:inherit;font-size:1.4rem;padding:18px;border:0;border-radius:22px;cursor:pointer;color:#fff;font-weight:600}
.big:focus-visible,.tabs button:focus-visible,.nav button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.listen{background:#2f7fd1}.rec{background:var(--rec)}.mine{background:var(--ok)}
.rec.on{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.03)}}
.nav{display:flex;justify-content:space-between;margin-top:16px}
.nav button{font:inherit;font-size:1.3rem;padding:12px 22px;border:0;border-radius:18px;background:var(--card);color:var(--ink);cursor:pointer}
.stars{margin-top:14px;font-size:1.6rem;min-height:2.2rem}
.msg{margin-top:10px;color:var(--mut);font-size:1rem;min-height:1.4rem}
.hint{color:var(--mut);margin:0 0 12px;font-size:1rem}
.fam{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:20px;padding:12px 14px;margin-bottom:10px}
.fam .t{flex:1;font-size:1.4rem;text-align:left;font-weight:600}
.fam button{font:inherit;border:0;border-radius:14px;padding:10px 14px;cursor:pointer;color:#fff}
.fam .ok{color:var(--ok);font-size:1.3rem}
@media (prefers-reduced-motion:reduce){.rec.on{animation:none}}
</style>
</head>
<body>
<div class="tabs" role="tablist">
  <button id="tPlay" aria-pressed="true">Jugar</button>
  <button id="tFam" aria-pressed="false">Voz de mamá o papá</button>
</div>
<main>
  <section id="play">
    <div class="card">
      <div class="emoji" id="emoji"></div>
      <div class="word" id="word"></div>
      <div class="row">
        <button class="big listen" id="bListen">Escuchar</button>
        <button class="big rec" id="bRec">Decirlo yo</button>
        <button class="big mine" id="bMine" hidden>Oír mi intento</button>
      </div>
      <div class="stars" id="stars" aria-live="polite"></div>
      <div class="msg" id="msg" aria-live="polite"></div>
    </div>
    <div class="nav">
      <button id="prev" aria-label="Palabra anterior">‹</button>
      <button id="next" aria-label="Palabra siguiente">›</button>
    </div>
  </section>
  <section id="fam" hidden>
    <p class="hint">Grabe cada palabra con su voz, despacio y claro. Para parar, toque otra vez. Si no graba una palabra, la app usa una voz del aparato.</p>
    <div id="famList"></div>
  </section>
</main>
<script>
var WORDS=[{w:'mamá',e:'👩'},{w:'papá',e:'👨'},{w:'dame',e:'🤲'},{w:'ayuda',e:'🙋'}];
var i=0,stars=0,attempt={},recorder=null;
var $=function(id){return document.getElementById(id)};
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
function save(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function say(t){$('msg').textContent=t}
function speak(w){
  var d=load('voz:'+w);
  if(d){new Audio(d).play();return}
  try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(w);u.lang='es-MX';u.rate=.7;speechSynthesis.speak(u)}catch(e){say('Este aparato no puede hablar. Grabe la voz en la otra pestaña.')}
}
function record(onDone,onStart){
  if(recorder){recorder.stop();return}
  if(!navigator.mediaDevices||!window.MediaRecorder){say('Este navegador no permite grabar.');return}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
    var ch=[];recorder=new MediaRecorder(s);
    recorder.ondataavailable=function(e){ch.push(e.data)};
    recorder.onstop=function(){
      s.getTracks().forEach(function(t){t.stop()});recorder=null;
      var r=new FileReader();r.onload=function(){onDone(r.result)};r.readAsDataURL(new Blob(ch,{type:ch[0]&&ch[0].type}));
    };
    recorder.start();onStart();
    setTimeout(function(){if(recorder)recorder.stop()},6000);
  }).catch(function(){say('No se pudo usar el micrófono. Revise el permiso del navegador.')});
}
function show(){
  var x=WORDS[i];$('emoji').textContent=x.e;$('word').textContent=x.w;
  $('bMine').hidden=!attempt[x.w];$('stars').textContent='⭐'.repeat(stars);say('');
}
$('bListen').onclick=function(){speak(WORDS[i].w)};
$('bRec').onclick=function(){
  var b=$('bRec'),w=WORDS[i].w;
  record(function(d){
    b.classList.remove('on');b.textContent='Decirlo yo';attempt[w]=d;
    stars=Math.min(stars+1,12);show();say('¡Muy bien! Lo intentaste.');
  },function(){b.classList.add('on');b.textContent='Escuchando… toque para parar';say('')});
};
$('bMine').onclick=function(){var d=attempt[WORDS[i].w];if(d)new Audio(d).play()};
$('prev').onclick=function(){i=(i+WORDS.length-1)%WORDS.length;show()};
$('next').onclick=function(){i=(i+1)%WORDS.length;show()};
function tab(p){
  $('play').hidden=!p;$('fam').hidden=p;
  $('tPlay').setAttribute('aria-pressed',p);$('tFam').setAttribute('aria-pressed',!p);
  if(!p)famList();
}
$('tPlay').onclick=function(){tab(true)};
$('tFam').onclick=function(){tab(false)};
function famList(){
  var box=$('famList');box.innerHTML='';
  WORDS.forEach(function(x){
    var r=document.createElement('div');r.className='fam';
    r.innerHTML='<span class="t">'+x.e+' '+x.w+'</span>'+(load('voz:'+x.w)?'<span class="ok" title="Grabada">✓</span>':'');
    var p=document.createElement('button');p.textContent='Oír';p.style.background='#2f7fd1';p.onclick=function(){speak(x.w)};
    var g=document.createElement('button');g.textContent='Grabar';g.style.background='#ef6f5e';
    g.onclick=function(){
      record(function(d){
        g.textContent='Grabar';
        if(!save('voz:'+x.w,d))say('No se pudo guardar la grabación.');
        famList();
      },function(){g.textContent='Parar'});
    };
    r.appendChild(p);r.appendChild(g);box.appendChild(r);
  });
}
show();
</script>
</body>
</html>
